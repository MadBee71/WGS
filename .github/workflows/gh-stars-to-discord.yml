name: GitHub Stars to Discord
on:
  watch:
    types: [started] # fires exactly when someone stars the repo — no polling, no schedule
  workflow_dispatch: # allows manual testing

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"⭐ ${{ github.event.sender.login }} just starred WGS! Total stars: ${{ github.event.repository.stargazers_count }}\"}" \
            "${DISCORD_WEBHOOK_URL}"
